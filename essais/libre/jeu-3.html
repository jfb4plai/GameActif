<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le périmètre d'un polygone</title>
<style>
:root{--creme:#efe6d2;--panneau:#fbf6e9;--encre:#161616;--sarcelle:#1f8a8c;--jaune:#f6be2c;--vermillon:#e8412a;--vert:#cfe8d5;--ombre:rgba(0,0,0,.38)}
*{box-sizing:border-box}
body{margin:0;background:var(--creme);color:var(--encre);font-family:Arial,Helvetica,sans-serif;font-size:20px;line-height:1.4}
main{max-width:900px;margin:0 auto;padding:16px}
h1{font-family:Georgia,serif;font-weight:bold;font-size:30px;text-shadow:3px 3px 0 var(--jaune);margin:8px 0 12px}
.panneau{background:var(--panneau);border:2px solid var(--encre);box-shadow:4px 4px 0 var(--ombre);padding:14px;margin:12px 0}
button{font-family:'Courier New',monospace;font-weight:bold;font-size:20px;min-height:48px;min-width:48px;padding:8px 16px;background:var(--jaune);border:2px solid var(--encre);box-shadow:4px 4px 0 var(--ombre);cursor:pointer;color:var(--encre)}
button[aria-pressed="true"]{background:var(--encre);color:var(--creme)}
button:disabled{opacity:.55;cursor:not-allowed;box-shadow:none}
button:focus-visible{outline:4px solid var(--sarcelle);outline-offset:3px}
.barre{display:flex;gap:12px;flex-wrap:wrap}
.figure{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.figure svg{width:180px;height:auto;flex:none}
#donnees{font-size:24px;margin:0 0 6px}
#question{font-size:24px;margin:0 0 12px}
.options{display:flex;gap:16px;flex-wrap:wrap}
.reponse{font-family:Arial,Helvetica,sans-serif;font-size:28px;min-width:120px;min-height:64px;background:var(--panneau)}
.reponse.ecarte{text-decoration:line-through}
.reponse.juste{background:var(--vert);box-shadow:none}
.retour{border:2px solid var(--encre);border-left:12px solid var(--sarcelle);background:var(--panneau);padding:10px 14px;min-height:60px}
#progres{font-family:'Courier New',monospace;margin:0 0 8px}
#feu{position:relative;height:0}
.pt{position:absolute;left:50%;top:0;width:14px;height:14px;border:2px solid var(--encre);animation:eclat .9s ease-out forwards}
.pt:nth-child(3n){background:var(--jaune)}.pt:nth-child(3n+1){background:var(--sarcelle)}.pt:nth-child(3n+2){background:var(--vermillon)}
@keyframes eclat{from{transform:translate(0,0)}to{transform:translate(var(--dx),var(--dy));opacity:0}}
body.calme{background:#fff}
body.calme *{animation:none!important;transition:none!important}
</style>
</head>
<body>
<main>
<h1>Le périmètre d'un polygone</h1>
<div class="barre panneau">
  <button type="button" id="calme" aria-pressed="false">Mode calme</button>
  <button type="button" id="ecouter">Écouter</button>
  <button type="button" id="indice">Indice</button>
</div>
<p id="progres"></p>
<div class="panneau">
  <div class="figure">
    <svg id="dessin" viewBox="0 0 100 80" aria-hidden="true" fill="#cfe8d5" stroke="#161616" stroke-width="3" stroke-linejoin="round"></svg>
    <div>
      <p id="donnees"></p>
      <h2 id="question">Choisir le périmètre de la figure.</h2>
    </div>
  </div>
  <div class="options" id="options" role="group" aria-labelledby="question"></div>
  <p><button type="button" id="suite" hidden>Question suivante</button></p>
</div>
<div id="feu" aria-hidden="true"></div>
<div class="retour" id="retour" role="status" aria-live="polite"></div>
</main>
<script>
(function () {
  var ITEMS = [
    { donnees: 'Rectangle : 5 cm de long et 2 cm de large.', svg: '<polygon points="10,25 90,25 90,55 10,55"/>', calcul: '5 + 2 + 5 + 2 = 14', juste: 14, autres: [7, 10] },
    { donnees: 'Carré : chaque côté mesure 5 cm.', svg: '<polygon points="25,10 75,10 75,60 25,60"/>', calcul: '5 + 5 + 5 + 5 = 20', juste: 20, autres: [10, 25] },
    { donnees: 'Triangle : les côtés mesurent 3 cm, 4 cm et 5 cm.', svg: '<polygon points="10,70 60,70 10,25"/>', calcul: '3 + 4 + 5 = 12', juste: 12, autres: [6, 15] },
    { donnees: 'Rectangle : 9 cm de long et 4 cm de large.', svg: '<polygon points="5,22 95,22 95,58 5,58"/>', calcul: '9 + 4 + 9 + 4 = 26', juste: 26, autres: [13, 36] },
    { donnees: 'Hexagone : 6 côtés égaux de 3 cm chacun.', svg: '<polygon points="30,8 70,8 92,40 70,72 30,72 8,40"/>', calcul: '3 + 3 + 3 + 3 + 3 + 3 = 18', juste: 18, autres: [9, 15] },
    { donnees: 'Pentagone : 5 côtés égaux de 6 cm chacun.', svg: '<polygon points="50,5 92,35 76,75 24,75 8,35"/>', calcul: '6 + 6 + 6 + 6 + 6 = 30', juste: 30, autres: [24, 36] }
  ];
  var i = 0, resolu = false, erreurs = 0;
  var zoneO = document.getElementById('options');
  var retour = document.getElementById('retour');
  var suite = document.getElementById('suite');

  function melanger(t) {
    var a = t.slice();
    for (var k = a.length - 1; k > 0; k--) { var j = Math.floor(Math.random() * (k + 1)); var x = a[k]; a[k] = a[j]; a[j] = x; }
    return a;
  }
  function dire(t) { retour.textContent = t; }

  function afficher() {
    var it = ITEMS[i];
    resolu = false; erreurs = 0;
    suite.hidden = true;
    document.getElementById('progres').textContent = 'Figure ' + (i + 1) + ' sur ' + ITEMS.length;
    document.getElementById('dessin').innerHTML = it.svg;
    document.getElementById('donnees').textContent = it.donnees;
    zoneO.innerHTML = '';
    melanger([it.juste].concat(it.autres)).forEach(function (v) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'reponse';
      b.dataset.valeur = String(v);
      b.textContent = v + ' cm';
      b.addEventListener('click', function () { repondre(v, b); });
      zoneO.appendChild(b);
    });
    dire('Choisir la bonne réponse.');
    zoneO.querySelector('button').focus();
  }

  function boom() {
    if (document.body.classList.contains('calme')) return;
    var feu = document.getElementById('feu');
    for (var k = 0; k < 9; k++) {
      var s = document.createElement('span');
      s.className = 'pt';
      var a = (k / 9) * Math.PI * 2;
      s.style.setProperty('--dx', Math.round(Math.cos(a) * 70) + 'px');
      s.style.setProperty('--dy', Math.round(Math.sin(a) * 70 + 30) + 'px');
      s.addEventListener('animationend', function (e) { e.target.remove(); });
      feu.appendChild(s);
    }
  }

  function fin(revele) {
    resolu = true;
    var it = ITEMS[i];
    [].forEach.call(zoneO.querySelectorAll('button'), function (b) {
      b.disabled = true;
      if (b.dataset.valeur === String(it.juste)) { b.classList.add('juste'); b.textContent = '✓ ' + it.juste + ' cm'; }
    });
    if (revele) dire('Voici la bonne réponse : ' + it.juste + ' cm. Calcul : ' + it.calcul + '. On continue.');
    else { dire('Bien vu. Calcul : ' + it.calcul + '.'); boom(); }
    suite.hidden = false;
    suite.textContent = i === ITEMS.length - 1 ? 'Terminer' : 'Question suivante';
    suite.focus();
  }

  function repondre(v, b) {
    if (resolu) return;
    if (v === ITEMS[i].juste) { fin(false); return; }
    erreurs += 1;
    b.classList.add('ecarte'); b.disabled = true;
    if (erreurs >= 3) { fin(true); return; }
    dire('Pas tout à fait. Regarde l’indice.');
    // Le bouton cliqué devient inactif : le focus clavier passe à la première réponse encore utilisable.
    var reste = [].filter.call(zoneO.querySelectorAll('button'), function (x) { return !x.disabled; })[0];
    if (reste) reste.focus();
  }

  suite.addEventListener('click', function () {
    if (i < ITEMS.length - 1) { i += 1; afficher(); }
    else {
      document.getElementById('dessin').innerHTML = '';
      document.getElementById('donnees').textContent = 'Bravo, les six figures sont faites.';
      zoneO.innerHTML = '';
      suite.hidden = true;
      document.getElementById('progres').textContent = 'Terminé';
      dire('Bravo. Le périmètre est la longueur du contour de la figure.');
    }
  });

  document.getElementById('indice').addEventListener('click', function () {
    if (resolu) { dire('Passer à la figure suivante.'); return; }
    var it = ITEMS[i];
    var cible = [].filter.call(zoneO.querySelectorAll('button'), function (b) { return !b.disabled && b.dataset.valeur !== String(it.juste); })[0];
    if (!cible) { dire('Plus de réponse à écarter.'); return; }
    cible.classList.add('ecarte'); cible.disabled = true;
    dire('Une réponse est écartée. Choisir parmi celles qui restent.');
  });

  document.getElementById('ecouter').addEventListener('click', function () {
    if (!('speechSynthesis' in window)) { dire('La lecture à voix haute n’est pas disponible ici.'); return; }
    var u = new SpeechSynthesisUtterance(document.getElementById('donnees').textContent + ' Choisir le périmètre de la figure.');
    var voix = window.speechSynthesis.getVoices();
    var v = voix.filter(function (x) { return x.lang === 'fr-BE'; })[0] || voix.filter(function (x) { return x.lang.indexOf('fr') === 0; })[0];
    if (v) { u.voice = v; u.lang = v.lang; } else { u.lang = 'fr-BE'; }
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  });

  var calme = document.getElementById('calme');
  function appliquerCalme(actif) {
    document.body.classList.toggle('calme', actif);
    calme.setAttribute('aria-pressed', String(actif));
    calme.textContent = actif ? 'Mode calme : activé' : 'Mode calme';
  }
  calme.addEventListener('click', function () { appliquerCalme(calme.getAttribute('aria-pressed') !== 'true'); });
  appliquerCalme(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  afficher();
})();
</script>
</body>
</html>
