<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Les quadrilatères</title>
<style>
:root{--creme:#efe6d2;--panneau:#fbf6e9;--encre:#161616;--sarcelle:#1f8a8c;--jaune:#f6be2c;--vermillon:#e8412a;--vert:#cfe8d5;--ombre:rgba(0,0,0,.38)}
*{box-sizing:border-box}
body{margin:0;background:var(--creme);color:var(--encre);font-family:Arial,Helvetica,sans-serif;font-size:20px;line-height:1.4}
main{max-width:900px;margin:0 auto;padding:16px}
h1{font-family:Georgia,serif;font-weight:bold;font-size:30px;text-shadow:3px 3px 0 var(--jaune);margin:8px 0 12px}
.panneau{background:var(--panneau);border:2px solid var(--encre);box-shadow:4px 4px 0 var(--ombre);padding:14px;margin:12px 0}
button{font-family:'Courier New',monospace;font-weight:bold;font-size:20px;min-height:48px;min-width:48px;padding:8px 16px;background:var(--jaune);border:2px solid var(--encre);box-shadow:4px 4px 0 var(--ombre);cursor:pointer;color:var(--encre)}
button[aria-pressed="true"]{background:var(--encre);color:var(--creme)}
button:disabled{opacity:.55;cursor:not-allowed;box-shadow:none}
button:focus-visible{outline:4px solid var(--sarcelle);outline-offset:3px}
.barre{display:flex;gap:12px;flex-wrap:wrap}
#question{font-family:Arial,Helvetica,sans-serif;font-size:26px;margin:0 0 12px}
.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.option{background:var(--panneau);min-height:150px;padding:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.option svg{width:100%;max-width:170px;height:auto}
.option.ecarte{text-decoration:line-through}
.option.ecarte svg{opacity:.35}
.option.juste{background:var(--vert);box-shadow:none}
.option .marque{font-family:Arial,Helvetica,sans-serif;font-size:20px;font-weight:bold;min-height:26px}
.retour{border:2px solid var(--encre);border-left:12px solid var(--sarcelle);background:var(--panneau);padding:10px 14px;min-height:60px}
#progres{font-family:'Courier New',monospace;margin:0 0 8px}
#feu{position:relative;height:0}
.pt{position:absolute;left:50%;top:0;width:14px;height:14px;border:2px solid var(--encre);animation:eclat .9s ease-out forwards}
.pt:nth-child(3n){background:var(--jaune)}.pt:nth-child(3n+1){background:var(--sarcelle)}.pt:nth-child(3n+2){background:var(--vermillon)}
@keyframes eclat{from{transform:translate(0,0)}to{transform:translate(var(--dx),var(--dy));opacity:0}}
body.calme{background:#fff}
body.calme *{animation:none!important;transition:none!important}
</style>
</head>
<body>
<main>
<h1>Les quadrilatères</h1>
<div class="barre panneau">
  <button type="button" id="calme" aria-pressed="false">Mode calme</button>
  <button type="button" id="ecouter">Écouter</button>
  <button type="button" id="indice">Indice</button>
</div>
<p id="progres"></p>
<div class="panneau">
  <h2 id="question"></h2>
  <div class="options" id="options" role="group" aria-labelledby="question"></div>
  <p><button type="button" id="suite" hidden>Question suivante</button></p>
</div>
<div id="feu" aria-hidden="true"></div>
<div class="retour" id="retour" role="status" aria-live="polite"></div>
</main>
<script>
(function () {
  var FIGURES = {
    carre: { nom: 'carré', desc: 'quadrilatère à 4 côtés égaux et 4 angles droits',
      svg: '<polygon points="25,12 75,12 75,62 25,62"/>' },
    rectangle: { nom: 'rectangle', desc: 'quadrilatère à 2 longs côtés, 2 courts côtés et 4 angles droits',
      svg: '<polygon points="10,22 90,22 90,60 10,60"/>' },
    losange: { nom: 'losange', desc: 'quadrilatère à 4 côtés égaux, sans angle droit',
      svg: '<polygon points="50,15 95,40 50,65 5,40"/>' },
    parallelogramme: { nom: 'parallélogramme', desc: 'quadrilatère aux côtés opposés parallèles, sans angle droit',
      svg: '<polygon points="25,15 95,15 75,49.6 5,49.6"/>' },
    triangle: { nom: 'triangle', desc: 'figure à 3 côtés',
      svg: '<polygon points="50,8 90,72 10,72"/>' },
    pentagone: { nom: 'pentagone', desc: 'figure à 5 côtés',
      svg: '<polygon points="50,5 92,35 76,75 24,75 8,35"/>' }
  };
  var QUESTIONS = [
    { q: 'Quelle figure est un carré ?', juste: 'carre', autres: ['rectangle', 'losange', 'parallelogramme'] },
    { q: 'Quelle figure est un rectangle ?', juste: 'rectangle', autres: ['losange', 'parallelogramme', 'triangle'] },
    { q: 'Quelle figure est un losange ?', juste: 'losange', autres: ['rectangle', 'parallelogramme', 'triangle'] },
    { q: 'Quelle figure est un parallélogramme ?', juste: 'parallelogramme', autres: ['triangle', 'pentagone'] },
    { q: 'Quelle figure a 4 côtés égaux et 4 angles droits ?', juste: 'carre', autres: ['rectangle', 'parallelogramme'] },
    { q: 'Quelle figure a 4 côtés égaux et aucun angle droit ?', juste: 'losange', autres: ['rectangle', 'parallelogramme'] }
  ];
  var i = 0, resolu = false, ecartes = [], erreurs = 0;
  var zoneQ = document.getElementById('question');
  var zoneO = document.getElementById('options');
  var retour = document.getElementById('retour');
  var suite = document.getElementById('suite');

  function melanger(t) {
    var a = t.slice();
    for (var k = a.length - 1; k > 0; k--) { var j = Math.floor(Math.random() * (k + 1)); var x = a[k]; a[k] = a[j]; a[j] = x; }
    return a;
  }
  function dire(t) { retour.textContent = t; }

  function afficher() {
    var Q = QUESTIONS[i];
    resolu = false; ecartes = []; erreurs = 0;
    suite.hidden = true;
    document.getElementById('progres').textContent = 'Question ' + (i + 1) + ' sur ' + QUESTIONS.length;
    zoneQ.textContent = Q.q;
    zoneO.innerHTML = '';
    var ids = melanger([Q.juste].concat(Q.autres.length > 2 ? melanger(Q.autres).slice(0, 2) : Q.autres));
    ids.forEach(function (id) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'option';
      b.dataset.id = id;
      b.setAttribute('aria-label', 'Figure : ' + FIGURES[id].desc);
      b.innerHTML = '<svg viewBox="0 0 100 80" aria-hidden="true" fill="#cfe8d5" stroke="#161616" stroke-width="3" stroke-linejoin="round">' + FIGURES[id].svg + '</svg><span class="marque"></span>';
      b.addEventListener('click', function () { repondre(id, b); });
      zoneO.appendChild(b);
    });
    dire('Choisir la bonne figure.');
    zoneO.querySelector('button').focus();
  }

  function boom() {
    if (document.body.classList.contains('calme')) return;
    var feu = document.getElementById('feu');
    for (var k = 0; k < 9; k++) {
      var s = document.createElement('span');
      s.className = 'pt';
      var a = (k / 9) * Math.PI * 2;
      s.style.setProperty('--dx', Math.round(Math.cos(a) * 70) + 'px');
      s.style.setProperty('--dy', Math.round(Math.sin(a) * 70 + 30) + 'px');
      s.addEventListener('animationend', function (e) { e.target.remove(); });
      feu.appendChild(s);
    }
  }

  function fin(revele, bouton) {
    resolu = true;
    var Q = QUESTIONS[i];
    [].forEach.call(zoneO.querySelectorAll('button'), function (b) {
      b.disabled = true;
      if (b.dataset.id === Q.juste) { b.classList.add('juste'); b.querySelector('.marque').textContent = '✓ ' + FIGURES[Q.juste].nom; }
    });
    if (revele) dire('Voici la bonne réponse : ' + FIGURES[Q.juste].nom + '. On continue.');
    else { dire('Bien vu. C’est un ' + FIGURES[Q.juste].nom + '.'); boom(); }
    suite.hidden = false;
    suite.textContent = i === QUESTIONS.length - 1 ? 'Terminer' : 'Question suivante';
    suite.focus();
  }

  function repondre(id, b) {
    if (resolu) return;
    var Q = QUESTIONS[i];
    if (id === Q.juste) { fin(false, b); return; }
    erreurs += 1;
    b.classList.add('ecarte'); b.disabled = true; ecartes.push(id);
    b.querySelector('.marque').textContent = 'écartée';
    if (erreurs >= 3) { fin(true, b); return; }
    dire('Pas tout à fait. Regarde l’indice.');
    // Le bouton cliqué devient inactif : le focus clavier passe à la première figure encore utilisable.
    var reste = [].filter.call(zoneO.querySelectorAll('button'), function (x) { return !x.disabled; })[0];
    if (reste) reste.focus();
  }

  suite.addEventListener('click', function () {
    if (i < QUESTIONS.length - 1) { i += 1; afficher(); }
    else {
      zoneQ.textContent = 'Bravo, les six questions sont faites.';
      zoneO.innerHTML = '';
      suite.hidden = true;
      document.getElementById('progres').textContent = 'Terminé';
      dire('Bravo. Relire la fiche de contrôle avec l’enseignant si besoin.');
    }
  });

  document.getElementById('indice').addEventListener('click', function () {
    if (resolu) { dire('Passer à la question suivante.'); return; }
    var Q = QUESTIONS[i];
    var cible = [].filter.call(zoneO.querySelectorAll('button'), function (b) { return !b.disabled && b.dataset.id !== Q.juste; })[0];
    if (!cible) { dire('Plus de figure à écarter.'); return; }
    cible.classList.add('ecarte'); cible.disabled = true; cible.querySelector('.marque').textContent = 'écartée';
    dire('Une figure est écartée. Choisir parmi celles qui restent.');
  });

  document.getElementById('ecouter').addEventListener('click', function () {
    if (!('speechSynthesis' in window)) { dire('La lecture à voix haute n’est pas disponible ici.'); return; }
    var u = new SpeechSynthesisUtterance(zoneQ.textContent);
    var voix = window.speechSynthesis.getVoices();
    var v = voix.filter(function (x) { return x.lang === 'fr-BE'; })[0] || voix.filter(function (x) { return x.lang.indexOf('fr') === 0; })[0];
    if (v) { u.voice = v; u.lang = v.lang; } else { u.lang = 'fr-BE'; }
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  });

  var calme = document.getElementById('calme');
  function appliquerCalme(actif) {
    document.body.classList.toggle('calme', actif);
    calme.setAttribute('aria-pressed', String(actif));
    calme.textContent = actif ? 'Mode calme : activé' : 'Mode calme';
  }
  calme.addEventListener('click', function () { appliquerCalme(calme.getAttribute('aria-pressed') !== 'true'); });
  appliquerCalme(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  afficher();
})();
</script>
</body>
</html>
